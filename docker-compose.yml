services:
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wordpress_db}
    volumes:
      - ./data/dbdata:/var/lib/mysql
    command: '--default-authentication-plugin=mysql_native_password'
    networks:
      - wp-app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    depends_on:
      - db
    image: wordpress:6.8-fpm-alpine
    container_name: wordpress
    restart: unless-stopped
    env_file: .env
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=$MYSQL_USER
      - WORDPRESS_DB_PASSWORD=$MYSQL_PASSWORD
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE:-wordpress_db}
    volumes:
      - ./data/wordpress:/var/www/html
    networks:
      - wp-app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webserver:
    depends_on:
      - wordpress
    image: nginx:1.27-alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-example.com}
    volumes:
      - ./data/wordpress:/var/www/html
      - ./nginx-conf:/etc/nginx/templates
      - ./data/certbot-etc:/etc/letsencrypt
    networks:
      - wp-app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    depends_on:
      - webserver
    image: certbot/certbot
    container_name: certbot
    profiles:
      - certbot
    restart: "no"
    volumes:
      - ./data/certbot-etc:/etc/letsencrypt
      - ./data/wordpress:/var/www/html
    command: certonly --webroot --webroot-path=/var/www/html --email ${CERTBOT_EMAIL:-admin@example.com} --agree-tos --no-eff-email -d ${DOMAIN_NAME:-example.com}
    networks:
      - wp-app-network

networks:
  wp-app-network:
    driver: bridge